<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border outline -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="6" opacity="0.6"/>

  <!-- Glowing Backdrop Circle -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Clapperboard Body -->
  <g transform="translate(64, 88)">
    <!-- Clapper Stick Top (Angled / Open) -->
    <g transform="rotate(-14 40 100)">
      <rect x="10" y="30" width="364" height="64" rx="12" fill="#1e293b" stroke="#475569" stroke-width="4"/>
      <!-- Striped Patterns -->
      <polygon points="50,32 85,32 50,92 15,92" fill="url(#amberGrad)"/>
      <polygon points="120,32 155,32 120,92 85,92" fill="url(#amberGrad)"/>
      <polygon points="190,32 225,32 190,92 155,92" fill="url(#amberGrad)"/>
      <polygon points="260,32 295,32 260,92 225,92" fill="url(#amberGrad)"/>
      <polygon points="330,32 365,32 330,92 295,92" fill="url(#amberGrad)"/>
    </g>

    <!-- Clapperboard Lower Slate -->
    <rect x="18" y="120" width="348" height="230" rx="16" fill="#0f172a" stroke="#334155" stroke-width="5"/>
    
    <!-- Slate Internal Chalk Grid / Slate Lines -->
    <line x1="18" y1="195" x2="366" y2="195" stroke="#334155" stroke-width="4"/>
    <line x1="18" y1="270" x2="366" y2="270" stroke="#334155" stroke-width="4"/>
    <line x1="140" y1="195" x2="140" y2="270" stroke="#334155" stroke-width="4"/>
    <line x1="250" y1="195" x2="250" y2="270" stroke="#334155" stroke-width="4"/>

    <!-- Slate Text & Labels -->
    <text x="36" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#94a3b8" letter-spacing="4">PRODUCTION</text>
    <text x="36" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">SHOT LIST BREAKDOWN</text>

    <text x="36" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">SCENE</text>
    <text x="64" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#amberGrad)">01</text>

    <text x="156" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">SHOT</text>
    <text x="175" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f8fafc">1.1</text>

    <text x="268" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="2">TAKE</text>
    <text x="290" y="256" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#38bdf8">A</text>

    <!-- Bottom Slate Director Info -->
    <circle cx="48" cy="312" r="14" fill="#f59e0b" opacity="0.2"/>
    <polygon points="44,304 56,312 44,320" fill="#f59e0b"/>
    <text x="76" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1">DIRECTOR &amp; DoP PWA</text>

    <!-- Hinge Pin -->
    <circle cx="34" cy="116" r="10" fill="#64748b" stroke="#1e293b" stroke-width="3"/>
    <circle cx="34" cy="116" r="4" fill="#e2e8f0"/>
  </g>
</svg>
